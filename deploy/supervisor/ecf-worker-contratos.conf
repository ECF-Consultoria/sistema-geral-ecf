; 11/11/2026 — worker dedicado da geração de contratos na Clicksign.
; O Comercial notou o rascunho demorando a aparecer: o job leva 3-6s, mas
; esperava na fila `high` atrás do `desempenho:warm-cache` (5 a 9 min) no
; único worker dela. Lê `contratos` primeiro e ajuda a `high` quando ocioso.
; Ver .planning/learnings/clicksign-fila-da-geracao.md.
[program:ecf-worker-contratos]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/ecf_admin/artisan queue:work redis --queue=contratos,high --sleep=2 --tries=3 --timeout=600 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
environment=HOME="/tmp",TMPDIR="/tmp"
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/ecf_admin/storage/logs/worker-contratos.log
stopwaitsecs=600
