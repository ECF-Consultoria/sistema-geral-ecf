<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ícone quadrado da ECF — o formato que marketplaces de app costumam pedir
  (card/vitrine). Criado para o cadastro do app no Bling (Fase 184).

  Deriva da spec Phase 32 / D-01 LOCKED, com DUAS adaptações declaradas, próprias
  do formato ícone:
    1. O subtítulo "Consultoria & Assessoria" SAI — a 32 px de altura ele vira
       borrão. É prática padrão de app icon, não perda de identidade.
    2. A barra do gradiente vira HORIZONTAL (era vertical, 4x32). O gradiente
       mantém a mesma ordem de cores, lida da esquerda para a direita:
       azul -> rosa -> laranja -> amarelo.
  Fundo: #050507, o token `ecf-bg` do sistema.

  "ECF" usa text-anchor="middle": se Montserrat não estiver instalada e a fonte
  cair para Helvetica/Arial, o texto continua CENTRADO e a composição não quebra.
  Para fidelidade tipográfica garantida, exportar do arquivo original com o texto
  convertido em contornos.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ECF">
  <title>ECF Consultoria &amp; Assessoria</title>
  <defs>
    <linearGradient id="barraIconeEcf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e5ef3"/>
      <stop offset="40%" stop-color="#e84393"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="#050507"/>

  <text x="256" y="290" text-anchor="middle"
        font-family="Montserrat, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="170" letter-spacing="-3.4" fill="#ffffff">ECF</text>

  <rect x="176" y="327" width="160" height="14" rx="2" fill="url(#barraIconeEcf)"/>
</svg>
